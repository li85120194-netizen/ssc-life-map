<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>SSC 生活地图</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
  <style>
    *{box-sizing:border-box}body{margin:0;font-family:Inter,"Microsoft YaHei",sans-serif;color:#173d30;background:#fafaf7}button{font:inherit;cursor:pointer}header{height:72px;display:flex;align-items:center;gap:20px;padding:0 26px;background:#fff;border-bottom:1px solid #e8e8e1}.logo{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:#173d30;color:#fff;font-weight:900}.brand b{display:block}.brand small,.muted{color:#85918b;font-size:11px}.search{margin-left:28px;max-width:480px;flex:1;background:#f3f4f0;border:0;border-radius:13px;padding:13px 16px;color:#173d30}.add{margin-left:auto;border:0;border-radius:11px;background:#ee6b36;color:#fff;padding:12px 17px;font-weight:800}.nav,.scenes{display:flex;gap:8px;padding:11px 26px;background:#fff;border-bottom:1px solid #e8e8e1;overflow:auto}.nav button,.scenes button{border:1px solid #e4e5df;background:#fff;border-radius:20px;padding:8px 14px;color:#62736b;white-space:nowrap}.nav .on,.scenes .on{background:#173d30;color:#fff}.scenes .random{margin-left:auto;background:#ee6b36;color:#fff;border:0}.main{height:calc(100vh - 168px);min-height:520px;display:grid;grid-template-columns:1.65fr .85fr}#map{height:100%;background:#e6ece7}.side{background:#fafaf7;border-left:1px solid #e4e5df;padding:22px 16px;overflow:auto}.sideHead{display:flex;align-items:flex-end;justify-content:space-between;margin:2px 5px 12px}.side h1{font:26px Georgia,"Songti SC",serif;margin:4px 0}.status{font-size:11px;color:#7c8b84}.card{background:#fff;border:1px solid #e5e6df;border-radius:15px;padding:15px;margin:9px 0;transition:.2s}.card:hover,.card.active{border-color:#ee6b36;box-shadow:0 8px 25px #173d3014;transform:translateY(-1px)}.card h3{margin:0 0 6px;font-size:15px}.meta{font-size:11px;color:#78867f}.tag{display:inline-block;background:#f0f2ed;border-radius:14px;padding:5px 8px;font-size:10px;margin:8px 4px 0 0}.empty{padding:30px 15px;text-align:center;color:#7d8d85}.spinner{width:24px;height:24px;border:3px solid #dce5df;border-top-color:#ee6b36;border-radius:50%;animation:s 1s linear infinite;margin:10px auto}@keyframes s{to{transform:rotate(360deg)}}.leaflet-popup-content b{font-size:14px}.officePin{background:#173d30;border:3px solid #fff;border-radius:50%;box-shadow:0 3px 15px #0004}.poiPin{background:#ee6b36;border:2px solid #fff;border-radius:50%;box-shadow:0 2px 8px #0003}.modal{display:none;position:fixed;z-index:1000;inset:0;background:#173d3070;place-items:center}.modal.open{display:grid}.box{width:min(520px,90vw);background:#fff;border-radius:20px;padding:26px}.box button{border:0;padding:10px 14px;border-radius:9px}.close{float:right}.foot{font-size:11px;color:#74837c;line-height:1.7}.sourceNote{position:absolute;z-index:500;left:12px;bottom:24px;background:#ffffffee;padding:7px 10px;border-radius:16px;font-size:10px;box-shadow:0 2px 10px #0001}@media(max-width:850px){header{padding:0 14px}.search{display:none}.brand small{display:none}.nav,.scenes{padding-left:12px}.main{grid-template-columns:1fr;height:auto}.mapWrap{height:52vh}.side{border:0}.scenes .random{margin-left:0}}
  </style>
</head>
<body>
  <header><div class="logo">SS</div><div class="brand"><b>SSC 生活地图</b><small>员工共建 · 真实地点</small></div><input id="search" class="search" placeholder="搜索当前结果中的餐厅、咖啡或地点"><button class="add" onclick="openBox()">＋ 添加地点</button></header>
  <div class="nav" id="nav"><button class="on" data-cat="food">🍜 美食</button><button data-cat="coffee">☕ 咖啡</button><button data-cat="tea">🧋 奶茶</button><button data-cat="fun">🎮 娱乐</button><button data-cat="sport">🏃 运动</button><button data-cat="life">🛒 生活</button></div>
  <div class="scenes"><button class="on" data-range="all">全部</button><button data-range="500">500米内</button><button data-range="1000">1公里内</button><button data-range="walk">步行10分钟</button><button class="random" id="random">✦ 今天吃什么</button></div>
  <div class="main"><div class="mapWrap" style="position:relative"><div id="map"></div><div class="sourceNote">实时地点来自 OpenStreetMap · 无虚构商户</div></div><aside class="side"><div class="sideHead"><div><span class="muted">天津陆家嘴中心 B 座周边</span><h1 id="title">美食好去处</h1></div><span class="status" id="status">加载中</span></div><div id="list"><div class="empty"><div class="spinner"></div>正在读取周边真实地点…</div></div></aside></div>
  <div class="modal" id="modal"><div class="box"><button class="close" onclick="closeBox()">×</button><small class="muted">员工共建</small><h2>新增地点 / 补充信息</h2><p class="foot">公开原型已接入真实地图和 POI。员工评价、评分、收藏、图片上传及纠错需要连接数据库后才能跨设备保存；现阶段请通过 OpenStreetMap 页面补充公共地点数据。</p><a href="https://www.openstreetmap.org/fixthemap" target="_blank"><button style="background:#173d30;color:#fff">去补充地图信息</button></a></div></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const CENTER=[39.1462,117.1658], OFFICE='天津陆家嘴中心 B 座';
    const map=L.map('map',{zoomControl:true}).setView(CENTER,16);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap contributors</a>'}).addTo(map);
    L.circle(CENTER,{radius:1500,color:'#173d30',weight:1,fillColor:'#173d30',fillOpacity:.035}).addTo(map);
    L.marker(CENTER,{icon:L.divIcon({className:'',html:'<div class="officePin" style="width:22px;height:22px"></div>',iconSize:[22,22],iconAnchor:[11,11]})}).addTo(map).bindPopup('<b>'+OFFICE+'</b><br>办公楼中心').openPopup();
    const labels={food:'美食',coffee:'咖啡',tea:'奶茶',fun:'娱乐',sport:'运动',life:'生活'};
    let all=[],shown=[],markers=[],cat='food',range='all',query='';
    const q=`[out:json][timeout:25];(nwr(around:1500,${CENTER[0]},${CENTER[1]})[amenity~"restaurant|fast_food|food_court|cafe|bar|pub|cinema|theatre|pharmacy|bank|hospital|clinic"];nwr(around:1500,${CENTER[0]},${CENTER[1]})[shop];nwr(around:1500,${CENTER[0]},${CENTER[1]})[leisure~"fitness_centre|sports_centre|stadium|pitch|amusement_arcade|escape_game|bowling_alley"];);out center tags;`;
    const dist=(a,b)=>{const R=6371000,p=Math.PI/180,d1=(b[0]-a[0])*p,d2=(b[1]-a[1])*p,x=Math.sin(d1/2)**2+Math.cos(a[0]*p)*Math.cos(b[0]*p)*Math.sin(d2/2)**2;return 2*R*Math.asin(Math.sqrt(x))};
    function kind(t){const n=(t.name||'').toLowerCase(),a=t.amenity,l=t.leisure,s=t.shop;if(a==='cafe'&&/奶茶|茶饮|tea|heytea|奈雪|蜜雪/.test(n))return'tea';if(a==='cafe')return'coffee';if(['restaurant','fast_food','food_court','bar','pub'].includes(a))return'food';if(['cinema','theatre'].includes(a)||['amusement_arcade','escape_game','bowling_alley'].includes(l))return'fun';if(['fitness_centre','sports_centre','stadium','pitch'].includes(l))return'sport';if(s||['pharmacy','bank','hospital','clinic'].includes(a))return'life';return'life'}
    function render(){markers.forEach(m=>map.removeLayer(m));markers=[];shown=all.filter(p=>p.kind===cat&&(range==='all'||p.distance<=Number(range==='walk'?800:range))&&(!query||p.name.toLowerCase().includes(query)));document.getElementById('title').textContent=labels[cat]+'好去处';document.getElementById('status').textContent=shown.length+' 个真实地点';const list=document.getElementById('list');if(!shown.length){list.innerHTML='<div class="empty">当前范围暂未找到该类地点<br><small>可尝试其他分类或更大范围</small></div>';return}list.innerHTML='';shown.slice(0,80).forEach((p,i)=>{const m=L.marker([p.lat,p.lon],{icon:L.divIcon({className:'',html:'<div class="poiPin" style="width:14px;height:14px"></div>',iconSize:[14,14],iconAnchor:[7,7]})}).addTo(map).bindPopup('<b>'+esc(p.name)+'</b><br>'+Math.round(p.distance)+' 米 · '+labels[p.kind]);markers.push(m);const c=document.createElement('div');c.className='card';c.innerHTML='<h3>'+esc(p.name)+'</h3><div class="meta">📍 '+Math.round(p.distance)+' 米 · '+esc(p.address||labels[p.kind])+'</div><span class="tag">'+labels[p.kind]+'</span><span class="tag">真实 OSM 数据</span>';c.onclick=()=>{document.querySelectorAll('.card').forEach(x=>x.classList.remove('active'));c.classList.add('active');map.setView([p.lat,p.lon],18);m.openPopup()};list.appendChild(c)})}
    function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
    async function loadPOI(){const urls=['https://overpass.kumi.systems/api/interpreter','https://overpass-api.de/api/interpreter'];let data;for(const base of urls){const ctrl=new AbortController(),timer=setTimeout(()=>ctrl.abort(),12000);try{const r=await fetch(base+'?data='+encodeURIComponent(q),{signal:ctrl.signal});if(!r.ok)throw Error(r.status);data=await r.json();clearTimeout(timer);break}catch(e){clearTimeout(timer)}}if(!data)throw Error('all endpoints failed');all=data.elements.map(e=>{const lat=e.lat??e.center?.lat,lon=e.lon??e.center?.lon,t=e.tags||{};return{id:e.type+e.id,lat,lon,name:t.name||t['name:zh']||'',address:[t['addr:street'],t['addr:housenumber']].filter(Boolean).join(''),kind:kind(t),distance:dist(CENTER,[lat,lon])}}).filter(x=>x.lat&&x.lon&&x.name).sort((a,b)=>a.distance-b.distance);render()}
    loadPOI().catch(()=>{document.getElementById('status').textContent='读取失败';document.getElementById('list').innerHTML='<div class="empty">公共地点服务暂时繁忙<br><button onclick="location.reload()">重新加载</button></div>'});
    document.querySelectorAll('#nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('#nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on');cat=b.dataset.cat;render()});document.querySelectorAll('.scenes button[data-range]').forEach(b=>b.onclick=()=>{document.querySelectorAll('.scenes button[data-range]').forEach(x=>x.classList.remove('on'));b.classList.add('on');range=b.dataset.range;render()});document.getElementById('search').oninput=e=>{query=e.target.value.trim().toLowerCase();render()};document.getElementById('random').onclick=()=>{if(!shown.length)return alert('当前没有可推荐的地点');const p=shown[Math.floor(Math.random()*shown.length)];map.setView([p.lat,p.lon],18);markers[shown.indexOf(p)]?.openPopup();alert('今天去：'+p.name+'（约 '+Math.round(p.distance)+' 米）')};function openBox(){document.getElementById('modal').classList.add('open')}function closeBox(){document.getElementById('modal').classList.remove('open')}
  </script>
</body>
</html>
